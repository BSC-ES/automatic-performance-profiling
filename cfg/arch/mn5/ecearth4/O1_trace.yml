# System-dependent configuration for ECE4 build and runtime
#
# Marenostrum 5
#
# This configuration uses the Intel compilers, MKL and OpenMPI

- base.echo:
    msg: Apply system configuration for ecmwf-hpc2020

# load modules and set required environment variables

- hpc.module:
    cmd: reset

- hpc.module.load:
    names:
    - intel/2023.2.0
    - openmpi/4.1.5
    - hdf5/1.14.1-2-openmpi
    - pnetcdf/1.12.3-openmpi
    - fftw/3.3.10-openmpi
    - netcdf/c-4.9.2_fortran-4.6.1_cxx4-4.3.1_hdf5-1.14.1-2_pnetcdf-1.12.3-openmpi
    - cmake/3.29.2
    - aec/1.1.2
    - mkl/2024.1
    - ucx/1.16.0
    - extrae/4.2.4

- base.getenv:
    LD_LIBRARY_PATH: LD_LIBRARY_PATH
    MKLROOT: MKLROOT
    HDF5_DIR: HDF5_DIR 
    NETCDF_ROOT: NETCDF_ROOT

- base.setenv:
    NETCDF4_PARALLEL_DIR: /gpfs/apps/MN5/GPP/PNETCDF/1.12.3/INTEL/OPENMPI/
    OASIS_BUILD_PATH: "{{ experiment.src_dir }}/oasis3-mct-5.2/arch_ecearth"
    LD_LIBRARY_PATH:  "{{
      experiment.src_dir + '/oasis3-mct-5.2/arch_ecearth/lib'
      + (':' + experiment.src_dir + '/oifs-48r1/build/lib')
      + ':' + NETCDF_ROOT + '/lib'
      + (':' + LD_LIBRARY_PATH if LD_LIBRARY_PATH else '')
    }}"

    TBBMALLOC_DIR: "/apps/GPP/ONEAPI/2023.2.0/tbb/2021.10.0/lib/intel64/gcc4.8"
    TBBROOT: "/apps/GPP/ONEAPI/2023.2.0/tbb/2021.10.0/"
    MKL_CBWR: "AUTO,STRICT"

- base.context:
    platform:
      cpus_per_node: 112

    experiment:
      ini_dir: INIDATA

    build:
      lang:
        fortran:
          compiler: mpifort
          flags: -r8 -traceback -g -fp-model precise -fp-speculation=safe -O1 -xHost -finstrument-functions
          #   flags: -r8 -traceback -g -fp-model precise -fp-speculation=safe -O2 -xHost
          #   flags: -r8 -traceback -g -fp-model precise -fp-speculation=safe -O0 -xHost -init=snan,arrays -check uninit,bounds -fpe0
          preprocessor: fpp

        c:
          compiler: mpicc
          flags: -traceback -g -O1 -xHost -finstrument-functions
          preprocessor: cpp

        cxx:
          compiler: mpicxx

        linker:
          command: !noparse "{{ build.lang.fortran.compiler }}"

        make:
          command: gmake

      deps:
        mpi: null

        lapack:
          base_dir: "{{ MKLROOT }}"
          lib_dir: !noparse "{{ build.deps.lapack.base_dir }}/lib/intel64"
          libs: [mkl_intel_lp64, mkl_core, mkl_sequential]

        grib:
          base_dir: "{{ ECCODES_DIR }}"
          inc_dir: !noparse "{{ build.deps.grib.base_dir }}/include"
          lib_dir: !noparse "{{ build.deps.grib.base_dir }}/lib"
          libs: [eccodes_f90, eccodes, pthread]
          samples_path: "/MEMFS/samples:/MEMFS/ifs_samples/grib1_mlgrib2:/apps/GPP/ECCODES/2.34.1/INTEL/OPENMPI/share/eccodes/ifs_samples/grib1_mlgrib2"

        netcdf:
          base_dir: "{{ NETCDF_ROOT }}"
          inc_dir: !noparse "{{ build.deps.netcdf.base_dir }}/include"
          mod_dir: !noparse "{{ build.deps.netcdf.base_dir }}/include"
          lib_dir: !noparse "{{ build.deps.netcdf.base_dir }}/lib"
          libs: [netcdff, netcdf]

        hdf5: null

      oifs:
        lang:
          fortran:
            flags: -fpe0 -convert big_endian -march=core-avx2 -qopenmp -finstrument-functions -g
            flags_fixed: -r8
            macros: BLAS LITTLE LINUX INTEGER_IS_INT
          c:
            macros: BLAS LITTLE LINUX INTEGER_IS_INT _ABI64
          linker:
            flags: -qmkl=sequential -qopenmp
      oasis:
        lang:
          fortran:
            flags: -qopenmp -finstrument-functions -g
            flags_shared: -fPIC
          linker:
            flags: -qopenmp
            flags_shared: -shared