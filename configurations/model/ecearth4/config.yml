- base.context:
    scratch: "ECEARTH_ROOT"
    experiment:
      id: a00a
      run_dir: "RUN_FOLDER"

      schedule:
        all: !rrule >
          DTSTART:START_DATE
          RRULE:FREQ=FREQUENCY;UNTIL=END_DATE;INTERVAL=INTERVAL_VAL

      nemo:
        initial_state: null

      monitoring:
        activate: false

    model_config:
      components: [oifs, xios, nemo, rnfm, oasis]
      oifs:
        grid: !noparse "{{model_config.oifs.all_grids.TCO95L91}}"

      oasis:
        copy_weights: true

    job:
      launch:
        method: slurm-shell
        shell:
          script: run-srun-multiprog.sh
      resubmit: false
      oifs:
        ntasks: OIFS_PROCS
        ntasks_per_node: OIFS_PPN
        omp_num_threads: OIFS_OMP_THREADS
        omp_stacksize: "64M"
      nemo:
        ntasks: NEMO_PROCS
        ntasks_per_node: NEMO_PPN
      xios:
        ntasks: XIOS_PROCS
        ntasks_per_node: XIOS_PPN

      slurm:
        sbatch:
          opts:
            threads-per-core: 1
            time: 01:00:00
            account: spesiccf 
            output: !noparse "{{experiment.id}}.log"
            job-name: !noparse "ECE4_{{experiment.id}}"
        srun:
          args: [--label, --kill-on-bad-exit]
