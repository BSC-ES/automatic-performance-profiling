COMMON:
  GIT_REPO: automatic_performance_profile
  REFRESH_GIT_REPO: 'false'
  CONFIGURATION: BENCH
  EXP_ROOT: '%CURRENT_ROOTDIR%'
  PLATFORM: hpc2020
COMMON_PATH_LOCATIONS:
  PROJECT_ROOT: '%COMMON.EXP_ROOT%/%COMMON.GIT_REPO%'
  INIDATA_ROOT: '%CURRENT_ROOTDIR%/inidata'
  BINARIES_ROOT: '%CURRENT_ROOTDIR%/bin'
  RUN_ROOT: '%CURRENT_ROOTDIR%/run'
  COMPILATION_ROOT: '%CURRENT_ROOTDIR%/compilation'
  PROVIDED_TRACES_PATH: ""
  CFG: '%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg'
PARAMETERS_ENV_CONFIG:
  CONVERT_PARAM_FILE: '%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg/target/ConvertParamFile.py'
  CONFIG_FOLDER: '%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/configurations'
  ENV_SOURCES: '%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg/env/%COMMON.PLATFORM%/environment.env'
REPORT:
  CONFIG: '%COMMON_PATH_LOCATIONS.CFG%/latex/report.cfg'
  NAME: report
  FOLDER: '%CURRENT_ROOTDIR%/report'
PROJECT_FLAGS:
  MODEL_CONFIG_FOLDER: '%PARAMETERS_ENV_CONFIG.CONFIG_FOLDER%/model/%COMMON.MODEL%'
HW_BENCHMARKS:
  HW_BENCHMARKS_PARAMETERS_ROOT: '%PARAMETERS_ENV_CONFIG.CONFIG_FOLDER%/hardware_benchmarks'
  STREAM_NAMES: [1, 2, 4, 8, 16, 32, 48, 64, 128]
  STREAM_PROCESSORS: [1, 2, 4, 8, 16, 32, 48, 64, 128]
  OSU_NAMES: [128]
  OSU_PROCESSORS: [128]
  OSU_TESTS: "pt2pt/osu_multi_lat pt2pt/osu_mbw_mr collective/osu_allgather"
STRONGSCALING:
  STRONGSCALING_PARAMETERS_ROOT: '%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/strongscaling'
  TEST_NAMES: [BENCH]
  NAMES: [bench_128]
  PROCESSORS: [128]
  OIFS_PROCS: [63]
  NEMO_PROCS: [63]
  XIOS_PROCS: [1]
WEAKSCALING:
  WEAKSCALING_PARAMETERS_ROOT: '%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/MultiExperiment/weakscaling'
  TEST_NAMES: [0]
  NAMES: [128]
  PROCESSORS: [128]
  OIFS_PROCS: [63]
  NEMO_PROCS: [63]
  XIOS_PROCS: [1]
COMPILATION_EFFICIENCY:
  COMPILATION_EFFICIENCY_PARAMETERS_ROOT: '%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/MultiExperiment/compilation_efficiency'
  TEST_NAMES: [O0, O1, O3]
  NAMES: [O0_128, O1_128, O3_128]
  PROCESSORS: [128, 128, 128]
  OIFS_PROCS: [63, 63, 63]
  NEMO_PROCS: [63, 63, 63]
  XIOS_PROCS: [1, 1, 1]
