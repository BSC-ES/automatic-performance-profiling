# This file includes common configuration among models

# REPORT CONFIGURATION
REPORT:
  TITLE: "%DEFAULT.MODEL% performance report"
  AUTHORS: "Roc Salvador Andreazini"
  CONFIG: "%COMMON_PATH_LOCATIONS.CFG%/latex/report.cfg"
  NAME: report
  FOLDER: "%CURRENT_ROOTDIR%/report"
  LOGO_PATH: "%COMMON_PATH_LOCATIONS.CFG%/latex/img/bsc.png"

# HW_BENCHMARKS OPTIONS
HW_BENCHMARKS:
  HW_BENCHMARKS_PARAMETERS_ROOT: '%PARAMETERS_ENV_CONFIG.CONFIG_FOLDER%/hardware_benchmarks'
  OSU:
    ENABLED: true
    TESTS: "pt2pt/osu_multi_lat pt2pt/osu_mbw_mr collective/osu_allgather"
    NAMES:      [112, 224, 336]
    PROCESSORS: [112, 224, 336]
  STREAM:
    ENABLED: true
    NAMES:      [1, 2, 4, 8, 16, 32, 64, 92, 112]
    PROCESSORS: [1, 2, 4, 8, 16, 32, 64, 92, 112]

# TRACING COMMON OPTIONS
TRACING:
  PARAVER:
    # Enables Paraver views in the report
    ENABLED: false

    # Paraver cfg, for all PV views see cfg/trace_analysis/paraver_configurations
    CFGS: MPI_call p2p_size

    # Subset of Paraver cfgs
    COMPARE_CFGS:  MPI_call

  DIMEMAS:
    ENABLED: false

    # Paraver cfg, for all PV views see cfg/trace_analysis/dimemas_configurations
    CFGS: MPI_call p2p_size

  USER_FUNCTIONS:
    ENABLED: true
    PAPI_COUNTERS:
      # Space separated list where the elements are PC_id_1-PC_id_2,
      # you can get the ids from the papi_avail command
      PLOTS: PAPI_TOT_INS-PAPI_L1_DCM PAPI_TOT_INS-PAPI_L2_DCM PAPI_TOT_INS-PAPI_L3_TCM PAPI_TOT_INS-Time PAPI_L3_TCM-IPC
      ENABLED: true
    
    # If sampling is disabled the cfg/trace/model/MODEL/extrae_functions.txt function list
    # will be used
    SAMPLING:
      ENABLED: false

  # Enable/Disable Modelfactors images in the report
  MODELFACTORS:
    ENABLED: true

  # Enable/Disable MPI profiling results in the report
  MPI:
    ENABLED: true

# DO NOT MODIFY FROM THIS LINE
COMMON:
  GIT_REPO: automatic_performance_profile
  REFRESH_GIT_REPO: "false"
  CONFIGURATION: BENCH
  EXP_ROOT: "%CURRENT_ROOTDIR%"
COMMON_PATH_LOCATIONS:
  PROJECT_ROOT: "%COMMON.EXP_ROOT%/%COMMON.GIT_REPO%"
  INIDATA_ROOT: "%CURRENT_ROOTDIR%/inidata"
  BINARIES_ROOT: "%CURRENT_ROOTDIR%/bin"
  RUN_ROOT: "%CURRENT_ROOTDIR%/run"
  COMPILATION_ROOT: "%CURRENT_ROOTDIR%/compilation"
  PROVIDED_TRACES_PATH: ""
  CFG: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg"
PARAMETERS_ENV_CONFIG:
  CONVERT_PARAM_FILE: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg/target/ConvertParamFile.py"
  CONFIG_FOLDER: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/configurations"
PROJECT_FLAGS:
  MODEL_CONFIG_FOLDER: "%PARAMETERS_ENV_CONFIG.CONFIG_FOLDER%/model/%COMMON.MODEL%"