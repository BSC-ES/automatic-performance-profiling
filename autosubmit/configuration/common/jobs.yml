# This file defines the workflow
JOBS:
  # Cleans the previous run, WARNING this job deletes all data, is meant to use for development
  CLEAN:
    FILE: autosubmit/templates/clean.sh
    RUNNING: once
    WALLCLOCK: 00:30
    QUEUE: debug
    PLATFORM: marenostrum0
    CHECK: "true"
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
  # Downloads the git in the remote and some other stuff required by HW test, it requires connection to the internet
  REMOTE_SETUP:
    FILE: autosubmit/templates/remote_setup.sh
    DEPENDENCIES: CLEAN
    RUNNING: once
    WALLCLOCK: 00:30
    QUEUE: debug
    PLATFORM: marenostrum0
    CHECK: "true"
    #CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
  # Creates the folder "inidata" with the param_bash.cfg specific to each test, it requires connection to the internet due HW tests
  REMOTE_INIDATA:
    FILE: autosubmit/templates/INI.sh
    DEPENDENCIES: REMOTE_SETUP CLEAN
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
    PLATFORM: marenostrum0
  # Compiles all the tests, it requires connection to the internet due HW
  REMOTE_COMPILATION:
    FILE: autosubmit/templates/compilation.sh
    DEPENDENCIES: REMOTE_INIDATA
    RUNNING: member
    PROCESSORS: "4"
    WALLCLOCK: 00:50
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
    PLATFORM: marenostrum0
  # Mainly generates the folder structure of the runs
  PREPARE_TESTS:
    FILE: autosubmit/templates/Tests.sh
    DEPENDENCIES: REMOTE_COMPILATION
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # Selects the functions to be traced
  functions_dir:
    FILE: autosubmit/templates/functions_dir.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    PROCESSORS: "190"
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  trace_cut:
    FILE: autosubmit/templates/trace_cut.sh
    DEPENDENCIES:
      report_setup:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  dimemas_traces:
    FILE: autosubmit/templates/dimemas_traces.sh
    DEPENDENCIES:
      trace_cut:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  dimemas_images:
    FILE: autosubmit/templates/dimemas_images.sh
    DEPENDENCIES:
      dimemas_traces:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  paramedir:
    FILE: autosubmit/templates/paramedir.sh
    DEPENDENCIES:
      trace_cut:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "#SBATCH --cpus-per-task=48"
  paradim:
    FILE: autosubmit/templates/paradim.sh
    DEPENDENCIES:
      dimemas_traces:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "#SBATCH --cpus-per-task=48"
  paraver:
    FILE: autosubmit/templates/paraver.sh
    DEPENDENCIES:
      configuration_json:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: marenostrum0
  hardware_bench_images:
    FILE: autosubmit/templates/hardware_bench_images.sh
    DEPENDENCIES:
      report_setup:
        MEMBERS_FROM:
          StrongScaling, WeakScaling, CompilationEfficiency:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: marenostrum0
  modelfactors:
    FILE: autosubmit/templates/modelfactors.sh
    DEPENDENCIES:
      trace_cut:
        MEMBERS_FROM:
          HardwareBenchmarks, CompilationEfficiency, WeakScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  configuration_json:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES:
      paramedir:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      paradim:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  add_section:
    FILE: autosubmit/templates/add_section.sh
    DEPENDENCIES:
      paraver:
        MEMBERS_TO: StrongScaling,WeakScaling,CompilationEfficiency
      dimemas_images:
        MEMBERS_TO: StrongScaling,WeakScaling,CompilationEfficiency
      hardware_bench_images:
        MEMBERS_TO: HardwareBenchmarks
      modelfactors:
        MEMBERS_TO: StrongScaling
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: marenostrum0
  report:
    FILE: autosubmit/templates/report.sh
    DEPENDENCIES: add_section
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: marenostrum0