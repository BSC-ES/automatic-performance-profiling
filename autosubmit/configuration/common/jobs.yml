# This file defines the workflow
JOBS:
  # Cleans the previous run, WARNING this job deletes all data, is meant to use for development
  CLEAN:
    FILE: autosubmit/templates/clean.sh
    RUNNING: once
    WALLCLOCK: 00:30
    QUEUE: debug
    PLATFORM: marenostrum0
    CHECK: "true"
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
  # Downloads the git in the remote and some other stuff required by HW test, it requires connection to the internet
  REMOTE_SETUP:
    FILE: autosubmit/templates/remote_setup.sh
    DEPENDENCIES: CLEAN
    RUNNING: once
    WALLCLOCK: 00:30
    QUEUE: debug
    PLATFORM: marenostrum0
    CHECK: "true"
    #CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
  # Creates the folder "inidata" with the param_bash.cfg specific to each test, it requires connection to the internet due HW tests
  REMOTE_INIDATA:
    FILE: autosubmit/templates/INI.sh
    DEPENDENCIES: REMOTE_SETUP CLEAN
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
    PLATFORM: marenostrum0
  # Compiles all the tests, it requires connection to the internet due HW
  REMOTE_COMPILATION:
    FILE: autosubmit/templates/compilation.sh
    DEPENDENCIES: REMOTE_INIDATA
    RUNNING: member
    PROCESSORS: "4"
    WALLCLOCK: 00:50
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
    PLATFORM: marenostrum0
  # Mainly generates the folder structure of the runs
  PREPARE_TESTS:
    FILE: autosubmit/templates/Tests.sh
    DEPENDENCIES: REMOTE_COMPILATION
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # Performs the scalability test for all the tests except HW as it uses different tests
  Scalability:
    # This generates 3 differents jobs which only changes the number of processors
    FILE: autosubmit/templates/scalability.sh
    # This disables the HW tests from being generated
    FOR:
      NAME: [48, 96, 192, 768, 384]
      PROCESSORS: [48, 96, 192, 768, 384]
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # Selects the functions to be traced
  functions_dir:
    FILE: autosubmit/templates/functions_dir.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    PROCESSORS: "192"
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # Gets the traces
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      NAME: [48, 96, 192, 768, 384]
      PROCESSORS: [48, 96, 192, 768, 384]
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None

    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # HW test
  OSU_RUN:
    FOR:
      NAME: [48, 96, 192]
      PROCESSORS: [48, 96, 192]
    FILE: autosubmit/templates/osu_run.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # HW TEST
  STREAM:
    FOR:
      NAME: [1, 2, 4, 8, 16, 32, 48]
      PROCESSORS: [1, 2, 4, 8, 16, 32, 48]
    FILE: autosubmit/templates/stream.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      trace:
        FOR:
          NAME: [48, 96, 192, 768, 384]
          PROCESSORS: [48, 96, 192, 768, 384]
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      Scalability:
        FOR:
          NAME: [48, 96, 192, 768, 384]
          PROCESSORS: [48, 96, 192, 768, 384]
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      STREAM:
        FOR:
          NAME: [1, 2, 4, 8, 16, 32, 48]
          PROCESSORS: [1, 2, 4, 8, 16, 32, 48]
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, WeakScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      OSU_RUN:
        FOR:
          NAME: [48, 96, 192]
          PROCESSORS: [48, 96, 192]
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, WeakScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  trace_cut:
    FILE: autosubmit/templates/trace_cut.sh
    DEPENDENCIES:
      report_setup:
        MEMBERS_FROM:
          HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  dimemas:
