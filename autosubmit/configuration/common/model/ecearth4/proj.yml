# MODEL CONFIG
MODEL:
  NAME: ecearth4
  COMPONENTS: [nemo, oifs]
  ORIGIN: https://git.smhi.se/ec-earth/ecearth4.git
  BRANCH_LIST: main

  # Arch files prefixes to compile
  # There has to be two arch files for each arch name in cfg/arch/PLATFORM/MODEL/
  # - For ecearth4: O0-prod.yml and O0-trace.yml
  # - For nemo: arch-O0-prod.fcm and arch-O0-trace.fcm
  ARCH_NAMES: [O3, O3-intel]

# TRACE CONFIG
TRACING:
  START_DATE: 19900101
  END_DATE: 19900102
  FREQ: DAILY
  INTERVAL: 1
  TIMESTEP_ZERO: FALSE
  TRACE_STEPS: 32
  RESOLUTION: "TCO95L91+"
  OIFS_RESOLUTION: "TCO95L91"
  NEMO_RESOLUTION: 
  OUTPUT: FALSE

  # CONFIG FOR USER FUNCTIONS SAMPLING
  USER_FUNCTIONS_PROC: 112
  USER_FUNCTIONS_THREADS: 4
  TRACE_N_FUNCTIONS: 40

  TEST_NAMES: [BENCH, BENCH]
  NAMES: [trace_1, trace_2]
  PROCESSORS: [128, 256]
  OIFS_PROCS: [63, 127]
  NEMO_PROCS: [63, 127]
  XIOS_PROCS: [1, 1]
  THREADS: [1, 1]
  USE_OMP_THREDS: false
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
  ARCH_NAME: O3-intel
  PAPI_COUNTERS: "PAPI_TOT_INS PAPI_TOT_CYC PAPI_L3_TCM PAPI_L1_DCM PAPI_L2_DCM"
  PAPI_COUNTERS_PLOTS: "PAPI_TOT_INS-PAPI_L1_DCM PAPI_TOT_INS-PAPI_L2_DCM PAPI_TOT_INS-PAPI_L3_TCM PAPI_TOT_INS-Time PAPI_L3_TCM-IPC"

  PV_CASE_COMPARISSON_CFGS: "MPI_call"

# STRONG SCALING CONFIG
STRONGSCALING:
  STRONGSCALING_PARAMETERS_ROOT: "%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/strongscaling"

  RESOLUTION: "TCO95L91+eORCA1L75"
  OIFS_RESOLUTION: "TCO95L91"
  NEMO_RESOLUTION: "eORCA1L75"
  START_DATE: 19900101
  END_DATE: 19900102
  FREQ: DAILY
  INTERVAL: 1
  TEST_STEPS: 32
  OUTPUT: FALSE

  TEST_NAMES: [BENCH, BENCH]
  NAMES: [bench_1, bench_2]
  PROCESSORS: [112, 224]
  OIFS_PROCS: [55, 111]
  NEMO_PROCS: [55, 111]
  XIOS_PROCS: [1, 1]
  THREADS: [1, 1]
  USE_OMP_THREDS: false
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
  ARCH_NAME: O3

  COUPLING: 
    ENABLED: false

# WEAKSCALING CONFIG
WEAKSCALING:
  WEAKSCALING_PARAMETERS_ROOT: "%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/MultiExperiment/weakscaling"

  RESOLUTION: "TCO95L91+eORCA1L75"
  OIFS_RESOLUTION: "TCO95L91"
  NEMO_RESOLUTION: "eORCA1L75"
  START_DATE: 19900101
  END_DATE: 19900102
  FREQ: DAILY
  INTERVAL: 1
  TEST_STEPS: 32
  OUTPUT: FALSE

  BASE_PROCS: 128
  BASE_RESOLUTION: orca025
  TEST_NAMES: [orca025]
  NAMES: [orca025]
  PROCESSORS: [112]
  OIFS_PROCS: [55]
  NEMO_PROCS: [55]
  XIOS_PROCS: [1]
  THREADS: [1]
  TEST_CONFIG: BENCH
  ARCH_NAME: O3

# COMPILATION EFFICIENCY CONFIG
COMPILATION_EFFICIENCY:
  COMPILATION_EFFICIENCY_PARAMETERS_ROOT: "%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/MultiExperiment/compilation_efficiency"

  RESOLUTION: "TCO95L91+eORCA1L75"
  OIFS_RESOLUTION: "TCO95L91"
  NEMO_RESOLUTION: "eORCA1L75"
  START_DATE: 19900101
  END_DATE: 19900102
  FREQ: DAILY
  INTERVAL: 1
  TEST_STEPS: 32
  OUTPUT: FALSE

  # For compilation efficiency the arch name is taken from the test name
  TEST_NAMES: [O3, O3, O3-intel, O3-intel]
  NAMES:      [O3_112, O3_224, O3_intel_112, O3_intel_224]
  PROCESSORS: [112, 224, 112, 224]
  OIFS_PROCS: [55,  111, 55,  111]
  NEMO_PROCS: [55,  111, 55,  111]
  XIOS_PROCS: [1,   1,   1,   1]
  THREADS:    [1,   1,   1,   1]
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
