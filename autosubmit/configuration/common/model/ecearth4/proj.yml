COMMON:
  GIT_REPO: automatic_performance_profile
  REFRESH_GIT_REPO: "false"
  CONFIGURATION: BENCH
  EXP_ROOT: "%CURRENT_ROOTDIR%"
  PLATFORM: hpc2020
COMMON_PATH_LOCATIONS:
  PROJECT_ROOT: "%COMMON.EXP_ROOT%/%COMMON.GIT_REPO%"
  INIDATA_ROOT: "%CURRENT_ROOTDIR%/inidata"
  BINARIES_ROOT: "%CURRENT_ROOTDIR%/bin"
  RUN_ROOT: "%CURRENT_ROOTDIR%/run"
  COMPILATION_ROOT: "%CURRENT_ROOTDIR%/compilation"
  PROVIDED_TRACES_PATH: ""
  CFG: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg"
PARAMETERS_ENV_CONFIG:
  CONVERT_PARAM_FILE: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg/target/ConvertParamFile.py"
  CONFIG_FOLDER: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/configurations"
  ENV_SOURCES: "%COMMON_PATH_LOCATIONS.PROJECT_ROOT%/cfg/env/%COMMON.PLATFORM%/environment.env"
REPORT:
  CONFIG: "%COMMON_PATH_LOCATIONS.CFG%/latex/report.cfg"
  NAME: report
  FOLDER: "%CURRENT_ROOTDIR%/report"
PROJECT_FLAGS:
  MODEL_CONFIG_FOLDER: "%PARAMETERS_ENV_CONFIG.CONFIG_FOLDER%/model/%COMMON.MODEL%"

# MODEL CONFIG
MODEL:
  NAME: ecearth4
  COMPONENTS: [nemo, oifs]
  ORIGIN: https://git.smhi.se/e7992/ecearth4.git
  BRANCH_LIST: main

  TEST_STEPS: 32
  OUTPUT: FALSE

  # Arch files prefixes to compile
  # There has to be two arch files for each arch name in cfg/arch/PLATFORM/MODEL/
  # - For ecearth4: O0-prod.yml and O0-trace.yml
  # - For nemo: arch-O0-prod.fcm and arch-O0-trace.fcm
  ARCH_NAMES: [O1, O3]

# TRACE CONFIG
TRACING:
  TIMESTEP_ZERO: FALSE
  TRACE_STEPS: 32

  # CONFIG FOR USER FUNCTIONS SAMPLING
  USER_FUNCTIONS_PROC: 112
  USER_FUNCTIONS_THREADS: 4
  TRACE_N_FUNCTIONS: 40

  TEST_NAMES: [BENCH, BENCH]
  NAMES: [trace_1, trace_2]
  PROCESSORS: [128, 256]
  OIFS_PROCS: [63, 127]
  NEMO_PROCS: [63, 127]
  XIOS_PROCS: [1, 1]
  THREADS: [1, 1]
  USE_OMP_THREDS: false
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
  ARCH_NAME: O3
  PAPI_COUNTERS: "PAPI_TOT_INS PAPI_TOT_CYC PAPI_L3_TCM PAPI_L1_DCM PAPI_L2_DCM"
  PAPI_COUNTERS_PLOTS: "PAPI_TOT_INS-PAPI_L1_DCM PAPI_TOT_INS-PAPI_L2_DCM PAPI_TOT_INS-PAPI_L3_TCM PAPI_TOT_INS-Time PAPI_L3_TCM-IPC"

# HW BENCHMARKS CONFIG
HW_BENCHMARKS:
  HW_BENCHMARKS_PARAMETERS_ROOT: "%PARAMETERS_ENV_CONFIG.CONFIG_FOLDER%/hardware_benchmarks"
  STREAM_NAMES: [1, 2, 4, 8, 16, 32, 48, 64]
  STREAM_PROCESSORS: [1, 2, 4, 8, 16, 32, 48, 64]
  OSU_NAMES: [64, 128]
  OSU_PROCESSORS: [64, 128]
  OSU_TESTS: "pt2pt/osu_multi_lat pt2pt/osu_mbw_mr collective/osu_allgather"

# STRONG SCALING CONFIG
STRONGSCALING:
  STRONGSCALING_PARAMETERS_ROOT: "%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/strongscaling"
  TEST_NAMES: [BENCH, BENCH]
  NAMES: [bench_1, bench_2]
  PROCESSORS: [128, 256]
  OIFS_PROCS: [63, 127]
  NEMO_PROCS: [63, 127]
  XIOS_PROCS: [1, 1]
  THREADS: [1, 1]
  USE_OMP_THREDS: false
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
  ARCH_NAME: O3

# WEAKSCALING CONFIG
WEAKSCALING:
  WEAKSCALING_PARAMETERS_ROOT: "%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/MultiExperiment/weakscaling"
  TEST_NAMES: [orca025]
  NAMES: [orca025_336]
  PROCESSORS: [336]
  OIFS_PROCS: [127]
  NEMO_PROCS: [63]
  XIOS_PROCS: [1]
  THREADS: [1]
  TILE_SIZE: [62x40]
  MODEL_RESOLUTION: orca025
  TEST_CONFIG: BENCH
  ARCH_NAME: O3

# COMPILATION EFFICIENCY CONFIG
COMPILATION_EFFICIENCY:
  COMPILATION_EFFICIENCY_PARAMETERS_ROOT: "%PROJECT_FLAGS.MODEL_CONFIG_FOLDER%/MultiExperiment/compilation_efficiency"
  # For compilation efficiency the arch name is taken from the test name
  TEST_NAMES: [O1, O1, O3, O3]
  NAMES: [O1_112, O1_224, O3_112, O3_224]
  PROCESSORS: [128, 256, 128, 256]
  OIFS_PROCS: [63, 127, 63, 127]
  NEMO_PROCS: [63, 127, 63, 127]
  XIOS_PROCS: [1, 1, 1, 1]
  THREADS: [1, 1, 1, 1]
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
