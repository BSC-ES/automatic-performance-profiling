JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    # This generates 3 differents jobs which only changes the number of processors
    FOR:
      TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
      NAME: "%COMPILATION_EFFICIENCY.NAMES%"
      PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
    # This disables the HW tests from being generated
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          StrongScaling, WeakScaling, HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
      NAME: "%COMPILATION_EFFICIENCY.NAMES%"
      PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          StrongScaling, WeakScaling, HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "#SBATCH -C perfparanoid"
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
          NAME: "%COMPILATION_EFFICIENCY.NAMES%"
          PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, WeakScaling, HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
      Scalability:
        FOR:
          TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
          NAME: "%COMPILATION_EFFICIENCY.NAMES%"
          PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, WeakScaling, HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED