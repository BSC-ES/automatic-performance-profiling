JOBS:
  OSU_RUN:
    FOR:
      NAME: "%HW_BENCHMARKS.OSU_NAMES%"
      PROCESSORS: "%HW_BENCHMARKS.OSU_PROCESSORS%"
    FILE: autosubmit/templates/osu_run.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  # HW TEST
  STREAM:
    FOR:
      NAME: "%HW_BENCHMARKS.STREAM_NAMES%"
      PROCESSORS: "%HW_BENCHMARKS.STREAM_PROCESSORS%"
    FILE: autosubmit/templates/stream.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      STREAM:
        FOR:
          NAME: "%HW_BENCHMARKS.STREAM_NAMES%"
          PROCESSORS: "%HW_BENCHMARKS.STREAM_PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, WeakScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      OSU_RUN:
        FOR:
          NAME: "%HW_BENCHMARKS.OSU_NAMES%"
          PROCESSORS: "%HW_BENCHMARKS.OSU_PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, WeakScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: marenostrum0
