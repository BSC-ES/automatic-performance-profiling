JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    # This generates 3 differents jobs which only changes the number of processors
    FOR:
      TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
      NAME: "%WEAKSCALING.NAMES%"
      PROCESSORS: "%WEAKSCALING.PROCESSORS%"
    # This disables the HW tests from being generated
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
      NAME: "%WEAKSCALING.NAMES%"
      PROCESSORS: "%WEAKSCALING.PROCESSORS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "#SBATCH -C perfparanoid"
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
          NAME: "%WEAKSCALING.NAMES%"
          PROCESSORS: "%WEAKSCALING.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
      Scalability:
        FOR:
          TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
          NAME: "%WEAKSCALING.NAMES%"
          PROCESSORS: "%WEAKSCALING.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    QUEUE: debug
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: marenostrum0
  dimemas_traces:
    PLATFORM: marenostrum4
    QUEUE: bsc_es
    WALLCLOCK: 4:00
    CUSTOM_DIRECTIVES: "#SBATCH --cpus-per-task=48"