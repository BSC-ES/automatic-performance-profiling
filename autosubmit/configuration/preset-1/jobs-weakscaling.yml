JOBS:
  Scalability:
    # This generates 3 differents jobs which only changes the number of processors
    FOR:
      NAME: [768, 384]
      PROCESSORS: [768, 384]
    # This disables the HW tests from being generated
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
  trace:
    FOR:
      NAME: [768, 384]
      PROCESSORS: [768, 384]
    FILE: autosubmit/templates/extrae.sh
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None