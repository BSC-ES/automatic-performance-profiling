JOBS:
  CLEAN:
    PLATFORM: mn5-login
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
  REMOTE_SETUP:
    PLATFORM: mn5-login
  REMOTE_INIDATA:
    PLATFORM: mn5-login
  REMOTE_COMPILATION:
    FOR: 
      NAME: "%MODEL.ARCH_NAMES%"
      TEST_NAME: "%MODEL.ARCH_NAMES%"
    PROCESSORS: 1
    THREADS: 112
  PREPARE_TESTS:
    PLATFORM: mn5-login
  trace_cut:
    CUSTOM_DIRECTIVES: "['#SBATCH -p interactive']"
  modelfactors:
    PLATFORM: mn5-login
  report_setup:
    PLATFORM: mn5-login
  dimemas_traces:
    THREADS: 112
  dimemas_images:
    PLATFORM: mn5-login
  paramedir:
    THREADS: 112
  paradim:
    THREADS: 112
  paraver:
    PLATFORM: mn5-login
    X11: True
    X11_OPTIONS: "-A bsc32 --qos=gp_debug --x11=all --time=02:00:00 -c 12"
  hardware_bench_images:
    PLATFORM: mn5-login
  configuration_json:
    PLATFORM: mn5-login
  report:
    PLATFORM: mn5-login
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      TEST_NAME: "%TRACING.TEST_NAMES%"
      NAME: "%TRACING.NAMES%"
      PROCESSORS: "%TRACING.PROCESSORS%"
      THREADS: "%TRACING.THREADS%"
    CUSTOM_DIRECTIVES: "[ '#SBATCH -C perfparanoid' ]"