JOBS:
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      TEST_NAME: "%TRACING.TEST_NAMES%"
      NAME: "%TRACING.NAMES%"
      PROCESSORS: "%TRACING.PROCESSORS%"
      OIFS_PROCS: "%TRACING.OIFS_PROCS%"
      NEMO_PROCS: "%TRACING.NEMO_PROCS%"
      XIOS_PROCS: "%TRACING.XIOS_PROCS%"
      THREADS: "%TRACING.THREADS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%TRACING.TEST_NAMES%"
          NAME: "%TRACING.NAMES%"
          PROCESSORS: "%TRACING.PROCESSORS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED