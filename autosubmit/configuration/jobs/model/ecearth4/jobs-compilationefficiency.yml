JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    FOR:
      TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
      NAME: "%COMPILATION_EFFICIENCY.NAMES%"
      PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
      OIFS_PROCS: "%COMPILATION_EFFICIENCY.OIFS_PROCS%"
      NEMO_PROCS: "%COMPILATION_EFFICIENCY.NEMO_PROCS%"
      XIOS_PROCS: "%COMPILATION_EFFICIENCY.XIOS_PROCS%"
      AMIP_PROCS: "%COMPILATION_EFFICIENCY.AMIP_PROCS%"
      RNFM_PROCS: "%COMPILATION_EFFICIENCY.RNFM_PROCS%"
      THREADS: "%COMPILATION_EFFICIENCY.THREADS%"
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          StrongScaling, WeakScaling, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      Scalability:
        FOR:
          TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
          NAME: "%COMPILATION_EFFICIENCY.NAMES%"
          PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, WeakScaling, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED