JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    FOR:
      TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
      NAME: "%WEAKSCALING.NAMES%"
      PROCESSORS: "%WEAKSCALING.PROCESSORS%"
      XIOS_PROCS: "%WEAKSCALING.XIOS_PROCS%"
      OIFS_RESOLUTION: "%WEAKSCALING.OIFS_RESOLUTION%"
      NEMO_RESOLUTION: "%WEAKSCALING.NEMO_RESOLUTION%"
      AMIP_PROCS: "%WEAKSCALING.AMIP_PROCS%"
      RNFM_PROCS: "%WEAKSCALING.RNFM_PROCS%"
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      Scalability:
        FOR:
          TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
          NAME: "%WEAKSCALING.NAMES%"
          PROCESSORS: "%WEAKSCALING.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED