JOBS:
  trace:
    FILE: autosubmit/templates/scalability.sh
    FOR:
      TEST_NAME: "%TRACING.TEST_NAMES%"
      NAME: "%TRACING.NAMES%"
      PROCESSORS: "%TRACING.PROCESSORS%"
      THREADS: "%TRACING.THREADS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    CUSTOM_DIRECTIVES: "#SBATCH -C perfparanoid"
    NOTIFY_ON: FAILED
  post:
    FILE: autosubmit/templates/post.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%TRACING.TEST_NAMES%"
          NAME: "%TRACING.NAMES%"
          PROCESSORS: "%TRACING.PROCESSORS%"
          THREADS: "%TRACING.THREADS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
