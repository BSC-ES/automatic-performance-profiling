JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    FOR:
      TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
      NAME: "%STRONGSCALING.NAMES%"
      PROCESSORS: "%STRONGSCALING.PROCESSORS%"
      COMP1_PROCS: "%STRONGSCALING.COMP1_PROCS%"
      COMP2_PROCS: "%STRONGSCALING.COMP2_PROCS%"
      COMP3_PROCS: "%STRONGSCALING.COMP3_PROCS%"
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      Scalability:
        FOR:
          TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
          NAME: "%STRONGSCALING.NAMES%"
          PROCESSORS: "%STRONGSCALING.PROCESSORS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
