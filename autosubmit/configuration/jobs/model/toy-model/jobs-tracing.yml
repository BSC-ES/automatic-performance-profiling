JOBS:
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      TEST_NAME: "%TRACING.TEST_NAMES%"
      NAME: "%TRACING.NAMES%"
      PROCESSORS: "%TRACING.PROCESSORS%"
      COMP1_PROCS: "%TRACING.COMP1_PROCS%"
      COMP2_PROCS: "%TRACING.COMP2_PROCS%"
      COMP3_PROCS: "%TRACING.COMP3_PROCS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%TRACING.TEST_NAMES%"
          NAME: "%TRACING.NAMES%"
          PROCESSORS: "%TRACING.PROCESSORS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED