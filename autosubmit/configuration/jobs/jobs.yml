    DEPENDENCIES:
      paramedir:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      paradim:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      report_setup:
        MEMBERS_FROM:
          HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  report:
    FILE: autosubmit/templates/report.sh
    DEPENDENCIES:
      paraver:
        MEMBERS_TO: Tracing
      dimemas_images:
        MEMBERS_TO: Tracing
      hardware_bench_images:
        MEMBERS_TO: HardwareBenchmarks
      modelfactors:
        MEMBERS_TO: Tracing
      configuration_json:
        MEMBERS_TO: CompilationEfficiency,WeakScaling,Tracing,StrongScaling
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
