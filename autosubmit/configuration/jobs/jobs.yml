            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
  modelfactors:
    FILE: autosubmit/templates/modelfactors.sh
    DEPENDENCIES:
      trace_cut:
        MEMBERS_FROM:
          HardwareBenchmarks, CompilationEfficiency, WeakScaling, StrongScaling:
            DATES_TO: None
