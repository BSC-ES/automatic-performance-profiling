# This file defines the workflow
JOBS:
  # Cleans the previous run, WARNING this job deletes all data, is meant to use for development
  CLEAN:
    FILE: autosubmit/templates/clean.sh
    RUNNING: once
    WALLCLOCK: 00:10
    CHECK: "true"
    RERUN_ONLY: true
  SYNCHRONIZE:
    FILE: autosubmit/templates/synchronize.sh
    RUNNING: once
    WALLCLOCK: 00:10
    CHECK: "true"
    PLATFORM: local
    DEPENDENCIES: CLEAN
  # Downloads the git in the remote and some other stuff required by HW test, it requires connection to the internet
  REMOTE_SETUP:
    FILE: autosubmit/templates/remote_setup.sh
    DEPENDENCIES: SYNCHRONIZE
    RUNNING: once
    WALLCLOCK: 00:30
    CHECK: "true"
  # Creates the folder "inidata" with the param_bash.cfg specific to each test, it requires connection to the internet due HW tests
  REMOTE_INIDATA:
    FILE: autosubmit/templates/ini.sh
    DEPENDENCIES: REMOTE_SETUP
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
  # Compiles all the tests, it requires connection to the internet due HW
  REMOTE_COMPILATION:
    FILE: autosubmit/templates/compilation.sh
    DEPENDENCIES: REMOTE_INIDATA
    FOR: 
      NAME: "%MODEL.ARCH_NAMES%"
      TEST_NAME: "%MODEL.ARCH_NAMES%"
    WALLCLOCK: 02:00
    NOTIFY_ON: FAILED
  HW_COMPILATION:
    FILE: autosubmit/templates/compilation.sh
    DEPENDENCIES: 
      REMOTE_INIDATA:
        MEMBERS_FROM:
          Tracing, WeakScaling, CompilationEfficiency, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    NOTIFY_ON: FAILED
  # Mainly generates the folder structure of the runs
  PREPARE_TESTS:
    FILE: autosubmit/templates/tests.sh
    DEPENDENCIES:
      REMOTE_COMPILATION:
        FOR:
          NAME: "%MODEL.ARCH_NAMES%"
          TEST_NAME: "%MODEL.ARCH_NAMES%"
        MEMBERS_FROM:
          HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
      HW_COMPILATION:
        MEMBERS_FROM:
          Tracing, WeakScaling, CompilationEfficiency, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
  # Selects the functions to be traced
  functions_dir:
    FILE: autosubmit/templates/functions_dir.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    THREADS: "%TRACING.USER_FUNCTIONS_THREADS%"
    RUNNING: member
    WALLCLOCK: 02:00
    PROCESSORS: "%TRACING.USER_FUNCTIONS_PROC%"
    CHECK: "true"
    NOTIFY_ON: FAILED
  trace_cut:
    FILE: autosubmit/templates/trace_cut.sh
    DEPENDENCIES:
      report_setup:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PROCESSORS: 4
  dimemas_traces:
    FILE: autosubmit/templates/dimemas_traces.sh
    DEPENDENCIES:
      trace_cut:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  dimemas_images:
    FILE: autosubmit/templates/dimemas_images.sh
    DEPENDENCIES:
      dimemas_traces:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  paramedir:
    FILE: autosubmit/templates/paramedir.sh
    DEPENDENCIES:
      trace_cut:
        MEMBERS_FROM:
          HardwareBenchmarks, WeakScaling, CompilationEfficiency, StrongScaling:
            DATES_TO: None
