JOBS:
  OSU_RUN:
    FOR:
      NAME: "%HW_BENCHMARKS.OSU.NAMES%"
      PROCESSORS: "%HW_BENCHMARKS.OSU.PROCESSORS%"
    FILE: autosubmit/templates/osu_run.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, StrongScaling, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 01:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  STREAM:
    FOR:
      NAME: "%HW_BENCHMARKS.STREAM.NAMES%"
      PROCESSORS: "%HW_BENCHMARKS.STREAM.PROCESSORS%"
    FILE: autosubmit/templates/stream.sh
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, StrongScaling, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
  post:
    FILE: autosubmit/templates/post.sh
    DEPENDENCIES:
      STREAM:
        FOR:
          NAME: "%HW_BENCHMARKS.STREAM.NAMES%"
          PROCESSORS: "%HW_BENCHMARKS.STREAM.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, WeakScaling, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
      OSU_RUN:
        FOR:
          NAME: "%HW_BENCHMARKS.OSU.NAMES%"
          PROCESSORS: "%HW_BENCHMARKS.OSU.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, WeakScaling, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
