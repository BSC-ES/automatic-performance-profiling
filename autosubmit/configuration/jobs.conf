[REMOTE_SETUP]
FILE = autosubmit/templates/remote_setup.sh
RUNNING = once
WALLCLOCK = 02:00
QUEUE = debug
PLATFORM = marenostrum_archive
CHECK = true

[INI]
FILE = autosubmit/templates/INI.sh
DEPENDENCIES = REMOTE_SETUP
RUNNING = once
WALLCLOCK = 02:00
QUEUE = debug
CHECK = true
NOTIFY_ON = FAILED

[COMPILATION]
FILE = autosubmit/templates/compilation.sh
DEPENDENCIES = INI
RUNNING = once
WALLCLOCK = 02:00
QUEUE = debug
CHECK = true
NOTIFY_ON = FAILED