JOBS:
  SCALABILITY_STRONGSCALING:
    FILE: autosubmit/templates/scalability.sh autosubmit/templates/models/%DEFAULT.MODEL%/run.sh
    FOR:
      TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
      NAME: "%STRONGSCALING.NAMES%"
      PROCESSORS: "%STRONGSCALING.PROCESSORS%"
      OIFS_PROCS: "%STRONGSCALING.OIFS_PROCS%"
      NEMO_PROCS: "%STRONGSCALING.NEMO_PROCS%"
      XIOS_PROCS: "%STRONGSCALING.XIOS_PROCS%"
      AMIP_PROCS: "%STRONGSCALING.AMIP_PROCS%"
      RNFM_PROCS: "%STRONGSCALING.RNFM_PROCS%"
      THREADS: "%STRONGSCALING.THREADS%"
    DEPENDENCIES: PREPARE_TESTS
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  POST_STRONGSCALING:
    FILE: autosubmit/templates/post.sh autosubmit/templates/models/%DEFAULT.MODEL%/post.sh
    DEPENDENCIES:
      SCALABILITY_STRONGSCALING:
        FOR:
          TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
          NAME: "%STRONGSCALING.NAMES%"
          PROCESSORS: "%STRONGSCALING.PROCESSORS%"
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  CONFIGURATION_JSON_STRONGSCALING:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES: POST_STRONGSCALING
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED

EXPERIMENT:
  APP_TESTS:
    STRONGSCALING:
      ENABLED: "TRUE"
