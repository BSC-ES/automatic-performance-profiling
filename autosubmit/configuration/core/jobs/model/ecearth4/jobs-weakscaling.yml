JOBS:
  SCALABILITY_WEAKSCALING:
    FILE: autosubmit/templates/scalability.sh autosubmit/templates/models/%DEFAULT.MODEL%/run.sh
    FOR:
      TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
      NAME: "%WEAKSCALING.NAMES%"
      PROCESSORS: "%WEAKSCALING.PROCESSORS%"
      XIOS_PROCS: "%WEAKSCALING.XIOS_PROCS%"
      OIFS_RESOLUTION: "%WEAKSCALING.OIFS_RESOLUTION%"
      NEMO_RESOLUTION: "%WEAKSCALING.NEMO_RESOLUTION%"
      AMIP_PROCS: "%WEAKSCALING.AMIP_PROCS%"
      RNFM_PROCS: "%WEAKSCALING.RNFM_PROCS%"
    DEPENDENCIES: PREPARE_TESTS
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  POST_WEAKSCALING:
    FILE: autosubmit/templates/post.sh autosubmit/templates/models/%DEFAULT.MODEL%/post.sh
    DEPENDENCIES:
      SCALABILITY_WEAKSCALING:
        FOR:
          TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
          NAME: "%WEAKSCALING.NAMES%"
          PROCESSORS: "%WEAKSCALING.PROCESSORS%"
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  CONFIGURATION_JSON_WEAKSCALING:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES: POST_WEAKSCALING
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED

EXPERIMENT:
  APP_TESTS:
    WEAKSCALING:
      ENABLED: "TRUE"