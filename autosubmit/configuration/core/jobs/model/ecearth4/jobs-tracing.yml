JOBS:
  trace:
    FILE: autosubmit/templates/scalability.sh cfg/trace/utils.sh
    FOR:
      TEST_NAME: "%TRACING.TEST_NAMES%"
      NAME: "%TRACING.NAMES%"
      PROCESSORS: "%TRACING.PROCESSORS%"
      OIFS_PROCS: "%TRACING.OIFS_PROCS%"
      NEMO_PROCS: "%TRACING.NEMO_PROCS%"
      XIOS_PROCS: "%TRACING.XIOS_PROCS%"
      AMIP_PROCS: "%TRACING.AMIP_PROCS%"
      RNFM_PROCS: "%TRACING.RNFM_PROCS%"
      THREADS: "%TRACING.THREADS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  post:
    FILE: autosubmit/templates/post.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%TRACING.TEST_NAMES%"
          NAME: "%TRACING.NAMES%"
          PROCESSORS: "%TRACING.PROCESSORS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks, StrongScaling:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
  TRACE_CUT:
    FILE: autosubmit/templates/trace_cut.sh
    DEPENDENCIES: post
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PROCESSORS: 4
  DIMEMAS_TRACES:
    FILE: autosubmit/templates/dimemas_traces.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  DIMEMAS_IMAGES:
    FILE: autosubmit/templates/dimemas_images.sh
    DEPENDENCIES: DIMEMAS_TRACES
    WALLCLOCK: 02:00
    CHECK: "true"
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    NOTIFY_ON: FAILED
  PARAMEDIR:
    FILE: autosubmit/templates/paramedir.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  PARADIM:
    FILE: autosubmit/templates/paradim.sh
    DEPENDENCIES:
      DIMEMAS_TRACES:
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  PARAVER:
    FILE: autosubmit/templates/paraver.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  MODELFACTORS:
    FILE: autosubmit/templates/modelfactors.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  CONFIGURATION_JSON_TRACING:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES:
      post:
      PARAMEDIR:
      PARADIM:
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED