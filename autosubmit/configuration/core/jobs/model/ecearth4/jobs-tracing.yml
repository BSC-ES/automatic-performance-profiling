JOBS:
  FUNCTIONS_DIR:
    FILE: autosubmit/templates/functions_dir.sh
    DEPENDENCIES: PREPARE_TESTS
    THREADS: "%TRACING.USER_FUNCTIONS_THREADS%"
    RUNNING: member
    WALLCLOCK: 02:00
    PROCESSORS: "%TRACING.USER_FUNCTIONS_PROC%"
    OIFS_PROCS: "%TRACING.USER_FUNCTIONS_OIFS_PROCS%" 
    NEMO_PROCS: "%TRACING.USER_FUNCTIONS_NEMO_PROCS%"
    CHECK: "true"
    NOTIFY_ON: FAILED
  SCALABILITY_TRACING:
    FILE: autosubmit/templates/scalability.sh cfg/trace/utils.sh autosubmit/templates/models/%DEFAULT.MODEL%/run.sh configurations/model/ecearth4/experiment_config.yml.tmpl
    ARCH_NAME: "%TRACING.ARCH_NAME%"
    START_DATE: "%TRACING.START_DATE%"
    END_DATE: "%TRACING.END_DATE%"
    FREQ: "%TRACING.FREQ%"
    INTERVAL_VAL: "%TRACING.INTERVAL%"
    OIFS_RESOLUTION: "%EXPERIMENT.OIFS_RESOLUTION%"
    NEMO_RESOLUTION: "%EXPERIMENT.NEMO_RESOLUTION%"
    FOR:
      TEST_NAME: "%TRACING.TEST_NAMES%"
      NAME: "%TRACING.NAMES%"
      PROCESSORS: "%TRACING.PROCESSORS%"
      OIFS_PROCS: "%TRACING.OIFS_PROCS%"
      NEMO_PROCS: "%TRACING.NEMO_PROCS%"
      XIOS_PROCS: "%TRACING.XIOS_PROCS%"
      AMIP_PROCS: "%TRACING.AMIP_PROCS%"
      RNFM_PROCS: "%TRACING.RNFM_PROCS%"
      THREADS: "%TRACING.THREADS%"
    DEPENDENCIES: functions_dir
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    CUSTOM_DIRECTIVES: "%TRACING_CUSTOM_DIRECTIVES%"
    NOTIFY_ON: FAILED
  POST_TRACING:
    FILE: autosubmit/templates/post.sh autosubmit/templates/models/%DEFAULT.MODEL%/post.sh
    DEPENDENCIES:
      SCALABILITY_TRACING:
        FOR:
          TEST_NAME: "%TRACING.TEST_NAMES%"
          NAME: "%TRACING.NAMES%"
          PROCESSORS: "%TRACING.PROCESSORS%"
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  TRACE_CUT:
    FILE: autosubmit/templates/trace_cut.sh
    DEPENDENCIES: POST_TRACING
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PROCESSORS: 4
  DIMEMAS_TRACES:
    FILE: autosubmit/templates/dimemas_traces.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  DIMEMAS_IMAGES:
    FILE: autosubmit/templates/dimemas_images.sh
    DEPENDENCIES: DIMEMAS_TRACES
    WALLCLOCK: 02:00
    CHECK: "true"
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    NOTIFY_ON: FAILED
  PARAMEDIR:
    FILE: autosubmit/templates/paramedir.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  PARADIM:
    FILE: autosubmit/templates/paradim.sh
    DEPENDENCIES:
      DIMEMAS_TRACES:
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  PARAVER:
    FILE: autosubmit/templates/paraver.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  MODELFACTORS:
    FILE: autosubmit/templates/modelfactors.sh
    DEPENDENCIES: TRACE_CUT
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  ANALYSIS_TRACING:
    FILE: autosubmit/templates/analysis.sh
    DEPENDENCIES:
      POST_TRACING:
      PARAMEDIR:
      PARADIM:
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED

EXPERIMENT:
  APP_TESTS:
    TRACING:
      ENABLED: "TRUE"