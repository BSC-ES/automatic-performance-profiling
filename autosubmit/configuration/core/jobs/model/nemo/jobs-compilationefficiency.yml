JOBS:
  SCALABILITY_COMPILATION_EFFICIENCY:
    FILE: autosubmit/templates/scalability.sh autosubmit/templates/models/%DEFAULT.MODEL%/run.sh
    FOR:
      TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
      NAME: "%COMPILATION_EFFICIENCY.NAMES%"
      PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
      THREADS: "%COMPILATION_EFFICIENCY.THREADS%"
    DEPENDENCIES: PREPARE_TESTS
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  POST_COMPILATION_EFFICIENCY:
    FILE: autosubmit/templates/post.sh
    DEPENDENCIES:
      SCALABILITY_COMPILATION_EFFICIENCY:
        FOR:
          TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
          NAME: "%COMPILATION_EFFICIENCY.NAMES%"
          PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  CONFIGURATION_JSON_COMPILATION_EFFICIENCY:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES: POST_COMPILATION_EFFICIENCY
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED

EXPERIMENT:
  APP_TESTS:
    COMPILATION_EFFICIENCY:
      ENABLED: "TRUE"