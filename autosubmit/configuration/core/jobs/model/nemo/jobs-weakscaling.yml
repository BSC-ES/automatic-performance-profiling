JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    FOR:
      TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
      NAME: "%WEAKSCALING.NAMES%"
      PROCESSORS: "%WEAKSCALING.PROCESSORS%"
      THREADS: "%WEAKSCALING.THREADS%"
      RESOLUTION: "%WEAKSCALING.RESOLUTION%"
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  post:
    FILE: autosubmit/templates/post.sh
    DEPENDENCIES:
      Scalability:
        FOR:
          TEST_NAME: "%WEAKSCALING.TEST_NAMES%"
          NAME: "%WEAKSCALING.NAMES%"
          PROCESSORS: "%WEAKSCALING.PROCESSORS%"
        MEMBERS_FROM:
          StrongScaling, CompilationEfficiency, HardwareBenchmarks, Tracing:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
  CONFIGURATION_JSON_WEAKSCALING:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES: post
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED