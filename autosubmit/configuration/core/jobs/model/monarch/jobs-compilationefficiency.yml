JOBS:
  SIM_COMPILATION_EFFICIENCY:
    FILE: templates/sim.sh
    FOR:
      TEST_NAME: "%COMPILATION_EFFICIENCY.TEST_NAMES%"
      NAME: "%COMPILATION_EFFICIENCY.NAMES%"
      PROCESSORS: "%COMPILATION_EFFICIENCY.PROCESSORS%"
      JNPES: "%COMPILATION_EFFICIENCY.JNPES%"
      INPES: "%COMPILATION_EFFICIENCY.INPES%"
      WRITE_GROUPS: "%COMPILATION_EFFICIENCY.WRITE_GROUPS%"
      WRITE_TASKS: "%COMPILATION_EFFICIENCY.WRITE_TASKS%"
    SPLITS: "%COMPILATION_EFFICIENCY.SPLITS%"
    WALLCLOCK: 01:30
    NOTIFY_ON: FAILED
    RUNNING: chunk
    DEPENDENCIES:
      LOCAL_SEND_SPINUP:
      PREPROCVAR_READY:
      HERMES_GR:
  POST_COMPILATION_EFFICIENCY:
    FILE: autosubmit/templates/post.sh autosubmit/templates/models/%DEFAULT.MODEL%/post.sh
    DEPENDENCIES:
      SIM_COMPILATION_EFFICIENCY:
        FOR:
          NAME: "%COMPILATION_EFFICIENCY.NAMES%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  CONFIGURATION_JSON_COMPILATION_EFFICIENCY:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES: POST_COMPILATION_EFFICIENCY
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED

EXPERIMENT:
  APP_TESTS:
    COMPILATION_EFFICIENCY:
      ENABLED: "TRUE"