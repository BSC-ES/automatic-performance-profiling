JOBS:
  SIM_STRONGSCALING:
    FILE: templates/sim.sh
    FOR:
      TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
      NAME: "%STRONGSCALING.NAMES%"
      PROCESSORS: "%STRONGSCALING.PROCESSORS%"
      JNPES: "%STRONGSCALING.JNPES%"
      INPES: "%STRONGSCALING.INPES%"
      WRITE_GROUPS: "%STRONGSCALING.WRITE_GROUPS%"
      WRITE_TASKS: "%STRONGSCALING.WRITE_TASKS%"
    SPLITS: "%STRONGSCALING.SPLITS%"
    WALLCLOCK: 01:30
    NOTIFY_ON: FAILED
    DEPENDENCIES:
      LOCAL_SEND_SPINUP:
      PREPROCVAR_READY:
      HERMES_GR:
    RUNNING: chunk
  POST_STRONGSCALING:
    FILE: autosubmit/templates/post.sh
    DEPENDENCIES:
      SIM_STRONGSCALING:
        FOR:
          NAME: "%STRONGSCALING.NAMES%"
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
  CONFIGURATION_JSON_STRONGSCALING:
    FILE: autosubmit/templates/configuration_json.sh
    DEPENDENCIES: POST_STRONGSCALING
    PLATFORM: "%DEFAULT.LOGIN_PLATFORM%"
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED

EXPERIMENT:
  APP_TESTS:
    STRONGSCALING:
      ENABLED: "TRUE"