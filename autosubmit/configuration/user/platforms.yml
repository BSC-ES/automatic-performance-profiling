# User should have a ~/platforms_credentials.yml in your home directory with the following
# structure:
# PLATFORMS:
#   mn5:
#     USER: "bsc32XXX"
#   mn5-login:
#     USER: "bsc32XXX"
PLATFORMS:
  hpc2020:
    TYPE: ecaccess
    VERSION: slurm
    HOST: hpc-login
    PROJECT: spesiccf
    USER: "TOFILL"
    QUEUE: np
    EC_QUEUE: hpc
    SCRATCH_DIR: /ec/res4/scratch/c3rs
    ADD_PROJECT_TO_HOST: false
    PROCESSORS_PER_NODE: "128"
    MAX_WALLCLOCK: 48:00
    CUSTOM_DIRECTIVES: "[ '#SBATCH --hint=nomultithread' ]"
  mn5:
    TYPE: slurm
    HOST: glogin1.bsc.es
    PROJECT: bsc32
    USER: bsc032333
    QUEUE: gp_bsces
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: false
    MAX_WALLCLOCK: 02:00
    MAX_PROCESSORS: 3584
    TEMP_DIR: ''
  mn5-login:
    TYPE: ps
    HOST: glogin1.bsc.es
    PROJECT: bsc32
    USER: bsc032333
    SCRATCH_DIR: /gpfs/scratch
    ADD_PROJECT_TO_HOST: false
    MAX_PROCESSORS: 3584
    TEMP_DIR: ''