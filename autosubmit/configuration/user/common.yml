# This file includes shared workflow configurations by all the models


# REPORT CONFIGURATION
REPORT:
  TITLE: "%DEFAULT.MODEL% performance report"
  AUTHORS: "Roc Salvador Andreazini"
  CONFIG: "%COMMON_PATH_LOCATIONS.CFG%/latex/report.cfg"
  NAME: report
  FOLDER: "%CURRENT_ROOTDIR%/report"
  LOGO_PATH: "%COMMON_PATH_LOCATIONS.CFG%/latex/img/bsc.png"


# HW_BENCHMARKS OPTIONS
HW_BENCHMARKS:
  OSU:
    SOURCE: https://mvapich.cse.ohio-state.edu/download/mvapich/osu-micro-benchmarks-7.5.1.tar.gz
    ENABLED: true
    # Binaries names found under c/mpi/ OSU root directory
    TESTS: [pt2pt/standard/osu_multi_lat, pt2pt/standard/osu_mbw_mr, collective/blocking/osu_allgather]
    NAMES:      [112, 224, 336]
    PROCESSORS: [112, 224, 336]
  STREAM:
    ENABLED: true
    NAMES:      [1, 2, 4, 8, 16, 32, 64, 92, 112]
    PROCESSORS: [1, 2, 4, 8, 16, 32, 64, 92, 112]


# TRACING COMMON OPTIONS
TRACING:
  # EXTRAE XML OPTIONS
  EXTRAE:
    HOME: /apps/GPP/BSCTOOLS/extrae/4.2.13/openmpi_4_1_5/
    TRACING_LIB: libmpitracef.so
    TRACE_NAME: "%MODEL.NAME%.prv"

    MPI: 
      ENABLED: yes
      COUNTERS:
        ENABLED: yes
    
    CALLERS:
      ENABLED: no
      MPI:
        ENABLED: no
        LEVELS: 1-3
      SAMPLING:
        ENABLED: no
        LEVELS: 1-5

    USER_FUNCTIONS: 
      ENABLED: yes

      # If the sampling job is disabled TRACING.EXTRAE.USER_FUNCTIONS.LIST will be used to trace the user functions
      SAMPLING:
        ENABLED: false

      # List of user functions to be traced, if empty the default list located
      # in cfg/trace/model/MODEL/extrae_functions.txt will be used
      LIST:
        # - module_bsc_chemistry_mp_chem_driver_
        # - module_bsc_aero_mechanism_mp_aero_bsc_driver_
        # - module_sulfur_aq_chem_mp_run_sulfur_aqueous_
        # - module_bsc_chemistry_mp_mechanism_driver_
        # - module_bsc_dynamics_routines_chem_mp_adv2_chem_
        # - module_bsc_dynamics_routines_chem_mp_mono_chem_
        # - module_turbulence_mp_turbl_
        # - module_bsc_sedimentation_mp_sedimentation_

    PAPI_COUNTERS:
      ENABLED: yes
      LIST: "PAPI_TOT_INS,PAPI_TOT_CYC,PAPI_L1_DCM,PAPI_L2_DCM,PAPI_L3_TCM,PAPI_BR_INS,PAPI_BR_MSP,RESOURCE_STALLS"
    
    OPENMP:
      ENABLED: no

  # PARAVER OPTIONS
  PARAVER:
    # Enables Paraver views in the report
    ENABLED: true

    # Paraver cfg, for all PV views see cfg/trace_analysis/paraver_configurations
    CFGS: MPI_call p2p_size Average_IPC affinity_per_node L3_Total_cache_misses MPI_collective_call UserFunctions

    # Subset of Paraver cfgs
    COMPARE_CFGS:  MPI_call UserFunctions

  DIMEMAS:
    ENABLED: false

    # Paraver cfg, for all PV views see cfg/trace_analysis/dimemas_configurations
    CFGS: MPI_call p2p_size

  USER_FUNCTIONS:
    ENABLED: true
    PAPI_COUNTERS:
      # Space separated list where the elements are PC_id_1-PC_id_2,
      # you can get the ids from the papi_avail command
      PLOTS: PAPI_TOT_INS-PAPI_L1_DCM PAPI_TOT_INS-PAPI_L2_DCM PAPI_TOT_INS-PAPI_L3_TCM PAPI_TOT_INS-Time PAPI_L3_TCM-IPC
      ENABLED: true

  # Enable/Disable Modelfactors images in the report
  MODELFACTORS:
    ENABLED: true

  # Enable/Disable MPI profiling results in the report
  MPI:
    ENABLED: true