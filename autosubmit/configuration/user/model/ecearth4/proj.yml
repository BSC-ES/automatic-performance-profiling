# MODEL CONFIG
MODEL:
  NAME: ecearth4
  REPORT_COMPONENTS: [nemo, oifs]
  COMPONENTS: [oifs, xios, nemo, rnfm, oasis]
  ORIGIN: https://git.smhi.se/ec-earth/ecearth4.git
  # Project branch/commit
  BRANCH: 7eded8868b263ffeda38f3bac5f63b06c2526295

  # Arch file prefixes in cfg/arch/PLATFORM/MODEL/ (e.g. O3_ompi_prod.yml)
  ARCH_NAMES: [O3_ompi_trace, O3_ompi_prod, O3_impi_prod]

# EXPERIMENT CONFIG
EXPERIMENT:
  RESOLUTION: "TL255L91+eORCA1L75"
  OIFS_RESOLUTION: "TL255L91"
  NEMO_RESOLUTION: "eORCA1L75"

  START_DATE: 20241020
  END_DATE:   20241021
  FREQ: DAILY
  INTERVAL: 1
  TEST_STEPS: 32
  OUTPUT: FALSE

  INIDATA: /gpfs/projects/bsc32/models/ecearth/ece4-app/inidata

# TRACE CONFIG
TRACING:
  START_DATE: 20241020
  END_DATE:   20241021
  FREQ: DAILY
  INTERVAL: 1
  TIMESTEP_ZERO: FALSE
  TRACE_STEPS: 32
  OUTPUT: FALSE

  USER_FUNCTIONS_PROC: 112
  USER_FUNCTIONS_THREADS: 4
  TRACE_N_FUNCTIONS: 40

  TEST_NAMES: [BENCH,   BENCH  , BENCH  ]
  NAMES:      [trace_1, trace_2, trace_3]
  PROCESSORS: [112,     224    , 336    ]
  OIFS_PROCS: [55,      111    , 167    ]
  NEMO_PROCS: [55,      111    , 167    ]
  XIOS_PROCS: [1,       1      , 1      ]
  AMIP_PROCS: [1,       1      , 1      ]
  RNFM_PROCS: [1,       1      , 1      ]
  THREADS:    [2,       2      , 2      ]
  USE_OMP_THREADS: false
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
  ARCH_NAME: O3_ompi_trace


# STRONG SCALING CONFIG
STRONGSCALING:
  TEST_NAMES: [BENCH,   BENCH  , BENCH  , BENCH  , BENCH  ]
  NAMES:      [bench_1, bench_2, bench_3, bench_4, bench_5]
  PROCESSORS: [112,     224    , 336    , 448    , 560    ]
  OIFS_PROCS: [110,     222    , 334    , 446    , 558    ]
  NEMO_PROCS: [55,      111    , 167    , 223    , 279    ]
  XIOS_PROCS: [1,       1      , 1      , 1      , 1      ]
  AMIP_PROCS: [1,       1      , 1      , 1      , 1      ]
  RNFM_PROCS: [1,       1      , 1      , 1      , 1      ]
  THREADS:    [1,       1      , 1      , 1      , 1      ]
  USE_OMP_THREADS: false
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
  ARCH_NAME: O3_ompi_prod

  COUPLING_REPORT: 
    ENABLED: true
    LUCIA:
      IGNORE_INI_TS: 1
      IGNORE_END_TS: 1

# WEAKSCALING CONFIG
WEAKSCALING:
  NEMO_BASE_PROCS: 111
  OIFS_BASE_PROCS: 333
  NEMO_BASE_RESOLUTION: eORCA1L75
  OIFS_BASE_RESOLUTION: TL255L91

  # Processors computed at runtime from base values; set to 1 here
  TEST_NAMES:      [ws_1,      ws_1,      ws_1,      ws_1     ]
  NAMES:           [ws_1_1,    ws_1_2,    ws_1_3,    ws_1_4   ]
  PROCESSORS:      [1,         1,         1,         1,       ]
  XIOS_PROCS:      [1,         1,         1,         1,       ]
  AMIP_PROCS:      [1,         1,         1,         1,       ]
  RNFM_PROCS:      [1,         1,         1,         1,       ]
  OIFS_RESOLUTION: [TL255L91,  TL255L91,  TL255L91,  TL255L91 ]
  NEMO_RESOLUTION: [eORCA1L75, eORCA1L75, eORCA1L75, eORCA1L75]

  TEST_CONFIG: BENCH
  ARCH_NAME: O3_ompi_prod

# COMPILATION EFFICIENCY CONFIG
COMPILATION_EFFICIENCY:
  TEST_NAMES: [O3_ompi_prod, O3_ompi_prod, O3_ompi_prod, O3_impi_prod, O3_impi_prod, O3_impi_prod]
  NAMES:      [ompi_1,       ompi_2,       ompi_3,       impi_1,       impi_2,       impi_3      ]
  PROCESSORS: [112,          224,          336,          112,          224,          336         ]
  OIFS_PROCS: [55,           111,          167,          55,           111,          167         ]
  NEMO_PROCS: [55,           111,          167,          55,           111,          167         ]
  XIOS_PROCS: [1,            1,            1,            1,            1,            1           ]
  AMIP_PROCS: [1,            1,            1,            1,            1,            1           ]
  RNFM_PROCS: [1,            1,            1,            1,            1,            1           ]
  THREADS:    [1,            1,            1,            1,            1,            1           ]
  MODEL_RESOLUTION: orca1
  TEST_CONFIG: BENCH
