# MODEL CONFIG
MODEL:
  NAME: monarch
  COMPONENTS: [monarch]
  REPORT_COMPONENTS: [monarch]
  ORIGIN: https://gitlab.earth.bsc.es/es/auto-monarch.git
  BRANCH: master

  # Arch file prefixes in cfg/arch/PLATFORM/MODEL/ (e.g. impi_O3_prod.yml)
  ARCH_NAMES: [impi_O3_trace, impi_O3_prod, impi_O2_prod]

