# MODEL CONFIG
MODEL:
  NAME: hpcw
  # Available components for hpcw:
  # - icon
  # - nemo
  # Important: You can only use one of them at a time, so only one element in the COMPONENTS list.
  COMPONENTS: [icon]
  REPORT_COMPONENTS: [icon]
  ORIGIN: https://gitlab.dkrz.de/hpcw/hpcw.git
  BRANCH: v3.0

  # Arch file prefixes in cfg/arch/PLATFORM/MODEL/COMPONENT with format <ARCH_NAME>.env and <ARCH_NAME>.cmake
  ARCH_NAMES: [O1_prod, O3_prod, O3_trace]

  # Shared ExternalData cache (avoids re-downloading ICON/NEMO inputs per arch).
  # Leave empty for a throwaway store, populate with cfg/utils/hpcw/populate_store.sh
  STORE: "/gpfs/scratch/bsc32/bsc032333/hpcw-store"

# TRACE CONFIG
TRACING:
  TIMESTEP_ZERO: false
  TRACE_STEPS: 10

  USER_FUNCTIONS_PROC: 112
  USER_FUNCTIONS_THREADS: 4

  TEST_NAMES: [BENCH,   BENCH, ]
  NAMES:      [trace_1, trace_2]
  PROCESSORS: [112,     224,   ]
  THREADS:    [1,       1,     ]
  TEST_CONFIG: test_nwp_R02B04N06multi
  ARCH_NAME: O3_trace
  OUTPUT: false

# STRONG SCALING CONFIG
STRONGSCALING:
  TEST_NAMES: [BENCH, BENCH, BENCH, BENCH, BENCH, BENCH, BENCH]
  NAMES:      [bench_1, bench_2, bench_3, bench_4, bench_5, bench_6, bench_7]
  PROCESSORS: [896, 1344, 1792, 2240, 2688, 3136, 3584]
  THREADS:    [1, 1, 1, 1, 1, 1, 1]
  SPLITS: 3
  TEST_CONFIG: NextGEMS_R2B8_2020
  TEST_STEPS: 10
  ARCH_NAME: O3_prod
  OUTPUT: false

# COMPILATION EFFICIENCY CONFIG
COMPILATION_EFFICIENCY:
  ARCH_NAMES: [O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod, O3_prod]
  TEST_NAMES: [t8, t8, t8, t8, t4, t4, t4, t4, t1, t1, t1, t1]
  NAMES:      [t8_1, t8_2, t8_3, t8_4, t4_1,  t4_2, t4_3, t4_4, t1_1, t1_2, t1_3, t1_4]
  PROCESSORS: [112, 168, 224, 280, 224, 336, 448, 560, 896, 1344, 1792, 2240]
  THREADS:    [8, 8, 8, 8, 4, 4, 4, 4, 1, 1, 1, 1]
  SPLITS: 1
  TEST_CONFIG: NextGEMS_R2B8_2020
  TEST_STEPS: 10
  OUTPUT: false
