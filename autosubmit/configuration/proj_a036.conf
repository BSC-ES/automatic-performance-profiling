

[common]
GIT_REPO=nemo_performance_profile
####RUN_ANALISYS
EXP_ROOT = %CURRENT_ROOTDIR%
PROJECT_ROOT = %EXP_ROOT%/%GIT_REPO%
INIDATA_ROOT = %PROJECT_ROOT%/inidata
CONVERT_PARAM_FILE=%PROJECT_ROOT%/cfg/target/ConvertParamFile.py -p param.cfg -o cfg/target/param_bash.cfg
MODEL = nemo
CONFIGURATION = BENCH
CONFIG_FOLDER = %PROJECT_ROOT%/configurations/
MODEL_CONFIG_FOLDER = %CONFIG_FOLDER%/model/%MODEL%/

#####TESTS MAYBE IT IS NOT NECCESARY, BUT IS AN INIT
###### 
ENABLE_HW_BENCHMARKS = True
ENABLE_STRONGSCALING = True
ENABLE_WEAKSCALING   = True
ENABLE_COMPILATION_EFFICIENCY = True
######
##SINGLE_EXP
[HW_BENCHMARKS] # In 4.0 this variable can be renamed to PARAMETERS_FILE
HW_BENCHMARKS_PARAMETERS_ROOT = %CONFIG_FOLDER%/

[STRONGSCALING] # In 4.0 this variable can be renamed to PARAMETERS_FILE
STRONGSCALING_PARAMETERS_ROOT = %MODEL_CONFIG_FOLDER%/strongscaling/
###MULTI_EXP
[WEAKSCALING] # In 4.0 this variable can be renamed to PARAMETERS_FILE
WEAKSCALING_PARAMETERS_ROOT = %MODEL_CONFIG_FOLDER%/MultiExperiment/weakscaling/%CONFIGURATION%/

[COMPILATION_EFFICIENCY] # In 4.0 this variable can be renamed to PARAMETERS_FILE
COMPILATION_EFFICIENCY_PARAMETERS_ROOT = %MODEL_CONFIG_FOLDER%/MultiExperiment/compilation_efficiency/%CONFIGURATION%/

