[REMOTE_INIDATA]
FILE = autosubmit/templates/INI.sh
DEPENDENCIES = REMOTE_SETUP CLEAN
RUNNING = once
WALLCLOCK = 00:30
#QUEUE = debug
CHECK = true
NOTIFY_ON = FAILED
CUSTOM_DIRECTIVES = ["#SBATCH -p interactive"]
PLATFORM = marenostrum0
#EXPORT = cfg/env/MN4/environment.env
[REMOTE_COMPILATION]
FILE = autosubmit/templates/compilation.sh
DEPENDENCIES = REMOTE_INIDATA
RUNNING = member
PROCESSORS = 4
WALLCLOCK = 00:50
NOTIFY_ON = FAILED
CUSTOM_DIRECTIVES = ["#SBATCH -p interactive"]
PLATFORM = marenostrum0

[PREPARE_TESTS]
FILE = autosubmit/templates/Tests.sh
DEPENDENCIES = REMOTE_COMPILATION
RUNNING = chunk
WALLCLOCK = 00:30
QUEUE = debug
CHECK = true
NOTIFY_ON = FAILED

#number_of_processes=48 96 192
[Scalability_48]
FILE = autosubmit/templates/scalability.sh
DEPENDENCIES = PREPARE_TESTS
SELECT_MEMBERS = PREPARE_TESTS*[0]
RUNNING = once
PROCESSORS = 48
WALLCLOCK = 00:30
QUEUE = debug
CHECK = true
NOTIFY_ON = FAILED
