DEFAULT:
  CUSTOM_CONFIG:
    PRE:
    - '%PROJDIR%/autosubmit/configuration/core/defaults.yml'
    - '%PROJDIR%/autosubmit/configuration/user/model/%DEFAULT.MODEL%/'
    - '%PROJDIR%/autosubmit/configuration/user/'
    - '%PROJDIR%/autosubmit/configuration/core/jobs/jobs-execution.yml'
    - '%PROJDIR%/autosubmit/configuration/core/jobs/model/%DEFAULT.MODEL%/jobs.yml'

    # Enable a test by uncommenting its line, disable by commenting it out
    # - '%PROJDIR%/autosubmit/configuration/core/jobs/jobs-hwbenchmarks.yml'
    - '%PROJDIR%/autosubmit/configuration/core/jobs/model/%DEFAULT.MODEL%/jobs-strongscaling.yml'
    - '%PROJDIR%/autosubmit/configuration/core/jobs/model/%DEFAULT.MODEL%/jobs-compilationefficiency.yml'
    - '%PROJDIR%/autosubmit/configuration/core/jobs/model/%DEFAULT.MODEL%/jobs-tracing.yml'
    - '%PROJDIR%/autosubmit/configuration/core/jobs/model/%DEFAULT.MODEL%/jobs-weakscaling.yml'

    - '%PROJDIR%/autosubmit/configuration/core/jobs/jobs-common.yml'
    - '%PROJDIR%/autosubmit/configuration/core/platforms/%DEFAULT.HPCARCH%.yml'
    POST: "~/platforms_credentials.yml"
