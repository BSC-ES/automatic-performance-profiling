JOBS:
  Scalability:
    FILE: autosubmit/templates/scalability.sh
    FOR:
      TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
      NAME: "%STRONGSCALING.NAMES%"
      PROCESSORS: "%STRONGSCALING.PROCESSORS%"
    DEPENDENCIES:
      PREPARE_TESTS:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    QUEUE: np
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
  trace:
    FILE: autosubmit/templates/extrae.sh
    FOR:
      TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
      NAME: "%STRONGSCALING.NAMES%"
      PROCESSORS: "%STRONGSCALING.PROCESSORS%"
    DEPENDENCIES:
      functions_dir:
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
    RUNNING: member
    QUEUE: np
    WALLCLOCK: 02:00
    CHECK: "true"
    NOTIFY_ON: FAILED
    CUSTOM_DIRECTIVES: "#SBATCH -C perfparanoid"
  report_setup:
    FILE: autosubmit/templates/report_setup.sh
    DEPENDENCIES:
      trace:
        FOR:
          TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
          NAME: "%STRONGSCALING.NAMES%"
          PROCESSORS: "%STRONGSCALING.PROCESSORS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks:
            MEMBERS_TO: None
            CHUNKS_TO: None
            DATES_TO: None
      Scalability:
        FOR:
          TEST_NAME: "%STRONGSCALING.TEST_NAMES%"
          NAME: "%STRONGSCALING.NAMES%"
          PROCESSORS: "%STRONGSCALING.PROCESSORS%"
        MEMBERS_FROM:
          CompilationEfficiency, WeakScaling, HardwareBenchmarks:
            DATES_TO: None
            MEMBERS_TO: None
            CHUNKS_TO: None
    RUNNING: member
    WALLCLOCK: 00:30
    CHECK: "true"
    NOTIFY_ON: FAILED
